<script>
// A fixed scatter of stars (seeded, so the picture is the same every time).
let a = 12345;
const rand = () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
const s = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', (rand() * 1200).toFixed(0));
  c.setAttribute('cy', (rand() * 630).toFixed(0));
  c.setAttribute('r', (0.6 + rand() * 1.3).toFixed(1));
  c.setAttribute('fill', '#fff');
  c.setAttribute('opacity', (0.2 + rand() * 0.6).toFixed(2));
  s.append(c);
}
</script>
