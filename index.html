  <!-- Apply the saved theme (dark unless chosen otherwise) before the page draws, to avoid a flash. -->
  <script>
    var t = 'dark';
    try {
      t = JSON.parse(localStorage.getItem('excitement-compass-v1')).settings.theme || 'dark';
    } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);

  <div class="app">
    <p class="notice" id="storage-notice" hidden data-text="storage.unavailable"></p>

    <main class="screens">
      <!-- Home -->
      <section class="screen screen--home" id="screen-home" data-screen="home" aria-labelledby="home-title">
        <h1 class="app-name" id="home-title" data-text="appName"></h1>

        <div class="home-center">
          <div class="home-idle" id="home-idle">
            <p class="home-active-label" id="home-question-label" data-text="home.questionLabel" hidden></p>
            <p class="home-line" id="home-line" role="button" tabindex="0" data-label="home.nextQuote"></p>
          </div>

          <div class="home-active" id="home-active" hidden>
            <p class="home-active-label" data-text="home.activeLabel"></p>
            <p class="home-pick" id="home-pick"></p>
          </div>
        </div>

        <div class="home-actions">
          <button class="btn btn--gold btn--large" id="find-pull" type="button" data-text="home.findPull"></button>
          <button class="btn btn--gold btn--large" id="done-let-go" type="button" data-text="home.doneLetGo" hidden></button>
          <button class="btn-round" id="home-add-river" type="button" data-label="home.addRiver">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>

      <!-- Choose: option entry, then the pair comparison -->
      <section class="screen" id="screen-choose" data-screen="choose" aria-labelledby="choose-title" hidden>
        <div class="choose-entry" id="choose-entry">
          <h1 class="screen-title"><label id="choose-title" for="option-input" data-text="choose.title"></label></h1>

          <form class="option-form" id="option-form" autocomplete="off">
            <input class="option-input" id="option-input" type="text" maxlength="80"
                   enterkeyhint="enter">
            <button class="option-add" id="option-add" type="submit" data-label="choose.add">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </form>

          <ul class="chips" id="option-chips" aria-live="polite"></ul>
          <p class="hint" id="option-limit" data-text="choose.limit" hidden></p>

          <div class="suggestions" id="suggestions" hidden>
            <p class="suggestions-label" data-text="choose.saved"></p>
            <div class="tags tags--small" id="suggestion-cats" role="group" data-label="saved.title"></div>
            <ul class="chips" id="suggestion-chips"></ul>
          </div>

          <div class="screen-actions">
            <button class="btn btn--gold btn--large" id="start-compare" type="button" data-text="choose.findPull" disabled></button>
          </div>
        </div>

        <div class="compare" id="compare" hidden>
          <svg class="threads" id="threads" aria-hidden="true" focusable="false">
            <defs>
              <radialGradient id="th-orb-grad" cx="0.4" cy="0.35" r="0.7">
                <stop offset="0" stop-color="#fffaf0"/><stop offset="0.5" stop-color="#fbdf9a"/><stop offset="1" stop-color="#e29a45"/>
              </radialGradient>
              <radialGradient id="th-halo-grad">
                <stop offset="0" stop-color="#f3c46c" stop-opacity="0.34"/><stop offset="1" stop-color="#f3c46c" stop-opacity="0"/>
              </radialGradient>
              <filter id="th-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
            </defs>
            <circle id="th-halo-c" r="150" fill="url(#th-halo-grad)"/>
            <g id="th-flower" fill="none" stroke="#f3c46c" stroke-width="0.6" stroke-opacity="0.26"></g>
            <path class="thread thread--0" id="thread-0" fill="none" stroke-linecap="round"/>
            <path class="thread thread--1" id="thread-1" fill="none" stroke-linecap="round"/>
            <path class="thread-glow" id="thread-glow" fill="none" stroke-linecap="round" filter="url(#th-blur)"/>
            <circle id="th-ring" r="14" fill="#f8d58a" opacity="0.25"/>
            <circle id="th-orb" r="7" fill="url(#th-orb-grad)"/>
          </svg>

          <div class="compare-top">
            <button class="icon-btn" id="compare-undo" type="button" data-label="choose.back">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
          </div>

          <h1 class="screen-title compare-title" id="compare-title" data-text="choose.comparePrompt"></h1>

          <div class="pair" id="pair">
            <button class="card" type="button" data-side="0"></button>
            <button class="card" type="button" data-side="1"></button>
          </div>

          <button class="link-btn" id="compare-tie" type="button" data-text="choose.aboutTheSame"></button>
        </div>
      </section>

      <!-- Act: the top pick, with the compass pointing at it -->
      <section class="screen" id="screen-act" data-screen="act" aria-labelledby="act-pick" hidden>
        <div class="act-center">
          <p class="act-line" id="act-line" aria-live="polite"></p>
          <p class="scene-label" data-text="act.strongest"></p>
          <h1 class="act-pick" id="act-pick"></h1>
        </div>

        <div class="stack-actions">
          <button class="btn btn--gold btn--large" id="act-on-it" type="button" data-text="act.onIt"></button>
          <div class="act-row">
            <button class="btn btn--ghost act-secondary" id="act-not-possible" type="button" data-text="act.notPossible"></button>
            <button class="btn btn--ghost act-secondary act-smaller" id="act-smaller" type="button" data-text="act.makeSmaller"></button>
          </div>
        </div>
      </section>

      <!-- Where is this now? -->
      <section class="screen screen--outcome" id="screen-outcome" data-screen="outcome" aria-labelledby="outcome-pick" hidden>
        <h1 class="outcome-pick" id="outcome-pick"></h1>
        <p class="outcome-question" data-text="outcome.question"></p>
        <div class="outcome-options" role="group" aria-labelledby="outcome-pick">
          <button class="outcome-btn" type="button" data-outcome="complete"><span class="outcome-name" data-text="outcome.complete"></span><span class="outcome-hint" data-text="outcome.completeHint"></span></button>
          <button class="outcome-btn" type="button" data-outcome="pulling"><span class="outcome-name" data-text="outcome.pulling"></span><span class="outcome-hint" data-text="outcome.pullingHint"></span></button>
          <button class="outcome-btn" type="button" data-outcome="faded"><span class="outcome-name" data-text="outcome.faded"></span><span class="outcome-hint" data-text="outcome.fadedHint"></span></button>
        </div>
        <button class="link-btn outcome-back" id="outcome-back" type="button" data-text="outcome.back"></button>
      </section>

      <!-- Settle first -->
      <section class="screen screen--settle" id="screen-settle" data-screen="settle" aria-labelledby="settle-title" hidden>

<circle cx="195" cy="330" r="26" fill="#f8d58a" opacity="0.28"/>
</g></g>
</svg>
        <div class="settle-text">
          <h1 class="settle-title" id="settle-title" data-text="settle.title"></h1>
          <p class="scene-label settle-breath" id="settle-breath"></p>
          <div class="settle-dots" id="settle-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <div class="settle-skip"><button class="link-btn" id="settle-skip" type="button" data-text="settle.skip"></button></div>
      </section>

      <!-- Make it smaller -->
      <section class="screen screen--smaller" id="screen-smaller" data-screen="smaller" aria-labelledby="smaller-title" hidden>
        <p class="scene-label" data-text="smaller.label"></p>
        <form class="smaller-form" id="smaller-form" autocomplete="off">
          <h1 class="smaller-title" id="smaller-title" data-text="smaller.title"></h1>
          <p class="smaller-of"><span data-text="smaller.piecePrefix"></span> <span class="smaller-pick" id="smaller-pick"></span></p>
          <label class="visually-hidden" for="smaller-input" data-text="smaller.title"></label>
          <input class="option-input" id="smaller-input" type="text" maxlength="80" enterkeyhint="done" data-placeholder="smaller.placeholder">
          <ul class="chips smaller-chips" id="smaller-chips"></ul>

          <div class="smaller-actions">
            <button class="btn btn--gold btn--large" id="smaller-confirm" type="submit" data-text="smaller.confirm" disabled></button>
            <button class="link-btn" id="smaller-back" type="button" data-text="smaller.back"></button>
          </div>
        </form>
      </section>

      <!-- Release: an optional note, then a short closing line -->
      <section class="screen" id="screen-release" data-screen="release" aria-labelledby="release-title" hidden>
        <form class="release-form" id="release-form" autocomplete="off">
          <p class="release-pick" id="release-pick"></p>
          <h1 class="screen-title"><label id="release-title" for="release-note" data-text="release.prompt"></label></h1>
          <input class="option-input release-input" id="release-note" type="text" maxlength="200"
                 enterkeyhint="done" data-placeholder="release.placeholder">

          <div class="stack-actions">
            <button class="btn btn--gold btn--large" type="submit" data-text="release.letGo"></button>
            <button class="link-btn" id="release-skip" type="button" data-text="release.skip"></button>
          </div>
        </form>

        <div class="release-closing" id="release-closing" hidden>
          <p class="release-line" id="release-line" tabindex="-1"></p>
        </div>
      </section>

      <!-- Saved: every option written, sorted into categories -->
      <section class="screen" id="screen-saved" data-screen="saved" aria-labelledby="saved-title" hidden>
        <h1 class="screen-title" id="saved-title" data-text="saved.title"></h1>
        <p class="screen-subtitle" data-text="saved.subtitle"></p>

        <form class="option-form" id="saved-form" autocomplete="off">
          <input class="option-input" id="saved-input" type="text" maxlength="80"
                 enterkeyhint="enter" data-placeholder="saved.placeholder" data-label="saved.placeholder">
          <button class="option-add" type="submit" data-label="saved.add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <div class="tags" id="saved-target" role="group" data-label="saved.addTo"></div>

        <div id="saved-groups"></div>

        <button class="btn btn--ghost new-category" id="new-category" type="button" data-text="saved.newCategory"></button>
      </section>

      <!-- River log -->
      <section class="screen" id="screen-river" data-screen="river" aria-labelledby="river-title" hidden>
        <h1 class="screen-title" id="river-title" data-text="river.title"></h1>

        <form class="option-form" id="river-form" autocomplete="off">
          <input class="option-input" id="river-input" type="text" maxlength="200"
                 enterkeyhint="done" data-placeholder="river.placeholder" data-label="river.placeholder">
          <button class="option-add" id="river-add" type="submit" data-label="river.add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>

        <div class="tags" id="river-tags" role="group" data-label="river.tagLabel"></div>
        <p class="river-linked" id="river-linked" hidden></p>

        <p class="empty" id="river-empty" data-text="river.empty"></p>
        <ol class="timeline" id="river-list"></ol>
      </section>

      <!-- Look back -->
      <section class="screen" id="screen-lookback" data-screen="lookback" aria-labelledby="lookback-title" hidden>
        <h1 class="screen-title" id="lookback-title" data-text="lookBack.title"></h1>
        <p class="screen-subtitle" data-text="lookBack.subtitle"></p>

        <div class="lookback-filters" id="lookback-filters">
          <input class="option-input search-input" id="lookback-search" type="search"
                 enterkeyhint="search" data-placeholder="lookBack.search" data-label="lookBack.search">
          <div class="tags" id="lookback-tags" role="group" data-label="lookBack.filterLabel"></div>
        </div>

        <div class="strip" id="lookback-days"></div>
        <p class="empty" id="lookback-empty"></p>
      </section>

      <!-- About -->
      <section class="screen screen--about" id="screen-about" data-screen="about" aria-labelledby="about-title" hidden>
        <h1 class="visually-hidden" id="about-title" data-text="about.title"></h1>
        <div class="about-lines" id="about-lines"></div>
        <div class="about-body" id="about-body"></div>

        <section class="about-data" id="install-section" aria-labelledby="about-install-title">
          <h2 class="group-title" id="about-install-title" data-text="about.installTitle"></h2>
          <div class="data-action">
            <button class="btn btn--gold" id="install-app" type="button" data-text="about.installButton"></button>
            <p class="data-hint" data-text="about.installHint"></p>
          </div>
        </section>

        <section class="about-data" aria-labelledby="about-theme-title">
          <h2 class="group-title" id="about-theme-title" data-text="about.themeTitle"></h2>
          <div class="tags" id="theme-choice" role="group" data-label="about.themeTitle"></div>
        </section>

        <div class="switch-row">
          <span id="settle-switch-label" data-text="about.settleSwitch"></span>
          <button class="switch" id="settle-switch" type="button" role="switch" aria-labelledby="settle-switch-label" aria-checked="true"><span></span></button>
        </div>

        <section class="about-data" aria-labelledby="about-data-title">
          <h2 class="group-title" id="about-data-title" data-text="about.dataTitle"></h2>
          <p class="data-hint" data-text="about.backupHint"></p>
          <div class="data-row">
            <button class="btn btn--ghost" id="export-data" type="button" data-text="about.export"></button>
            <button class="btn btn--ghost" id="import-data" type="button" data-text="about.import"></button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>
          <p class="data-status" id="data-status" role="status"></p>
          <div class="data-action">
            <button class="btn btn--ghost" id="clear-history" type="button" data-text="about.clearHistory"></button>
            <p class="data-hint" data-text="about.clearHistoryHint"></p>
          </div>
          <div class="data-action">
            <button class="btn btn--danger" id="reset-app" type="button" data-text="about.reset"></button>
            <p class="data-hint" data-text="about.resetHint"></p>
          </div>
        </section>

        <p class="about-credit" id="about-credit"></p>
      </section>
    </main>

    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="#home" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 5.5l2 6.5-2 6.5-2-6.5z"/></svg>
        <span data-text="nav.home"></span>
      </a>
      <a class="nav-item" href="#saved" data-nav="saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
        <span data-text="nav.saved"></span>
      </a>
      <a class="nav-item" href="#river" data-nav="river">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c3-2.5 6 2.5 9 0s6 2.5 9 0M3 15c3-2.5 6 2.5 9 0s6 2.5 9 0"/></svg>
        <span data-text="nav.river"></span>
      </a>
      <a class="nav-item" href="#lookback" data-nav="lookback">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v4h4"/><path d="M12 8v4.5l3 2"/></svg>
        <span data-text="nav.lookBack"></span>
      </a>
      <a class="nav-item" href="#about" data-nav="about">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
        <span data-text="nav.about"></span>
      </a>
    </nav>
  </div>

  <!-- Bump ?v= on every release so browsers never mix old and new files. -->
  <!-- One sheet, filled in by app.js, for moving, renaming and deleting. -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <div class="sheet-body" id="sheet-body"></div>
      <button class="link-btn" id="sheet-close" type="button" data-text="saved.close"></button>
    </div>
  </dialog>

  <script src="strings.js?v=25"></script>
  <script src="storage.js?v=25"></script>
  <script src="sky.js?v=25"></script>
  <script src="app.js?v=25"></script>
</body>
</html>
